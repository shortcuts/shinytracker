org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# AGP 9 defaults to built-in Kotlin, which conflicts with this repo's convention
# plugins explicitly applying org.jetbrains.kotlin.android. Opt out until a
# separate migration to built-in Kotlin is planned. Built-in Kotlin opt-out also
# requires opting out of the new DSL (the old Kotlin plugin isn't compatible with it).
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
